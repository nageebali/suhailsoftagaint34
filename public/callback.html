<!DOCTYPE html>
<html>
<head>
    <title>معالجة تسجيل الدخول</title>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
</head>
<body>
    <script>
        // استخراج المعلمات من URL
        const params = new URLSearchParams(window.location.search);
        const code = params.get('code');
        const state = params.get('state');
        const error = params.get('error');

        if (error) {
            // معالجة الأخطاء
            console.error('Error from Google:', error);
            window.location.href = `/login?error=${encodeURIComponent(error)}`;
        } else if (code) {
            // إرسال الكود إلى الخادم
            axios.post('/api/google-auth', {
                code: code,
                codeVerifier: localStorage.getItem('codeVerifier'),
                state: state
            })
            .then(response => {
                // تخزين بيانات المستخدم وإعادة التوجيه
                localStorage.setItem('userData', JSON.stringify(response.data));
                window.location.href = '/dashboard';
            })
            .catch(err => {
                console.error('Auth Error:', err);
                window.location.href = '/login?error=auth_failed';
            });
        } else {
            window.location.href = '/';
        }
    </script>
</body>
</html>
