<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة التحكم</title>
    <style>
        .user-data {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 20px auto;
        }
    </style>
</head>
<body>
    <div class="user-data">
        <h2>بيانات المستخدم</h2>
        <p><strong>الاسم:</strong> <span id="userName"></span></p>
        <p><strong>البريد الإلكتروني:</strong> <span id="userEmail"></span></p>
        <p><strong>رقم الهاتف:</strong> <span id="userPhone"></span></p>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const userData = JSON.parse(localStorage.getItem('userData'));
            
            if (userData) {
                document.getElementById('userName').textContent = userData.name || 'غير متوفر';
                document.getElementById('userEmail').textContent = userData.email || 'غير متوفر';
                document.getElementById('userPhone').textContent = userData.phone || 'غير متوفر';
            } else {
                window.location.href = '/login';
            }
        });
    </script>
</body>
</html>
