<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        
        .login-container {
            background-color: #fff;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
            padding: 30px;
            width: 350px;
            text-align: center;
        }
        
        .google-btn {
            background-color: #fff;
            color: #757575;
            border: 1px solid #ddd;
            padding: 12px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            transition: background-color 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 20px 0;
        }
        
        .google-btn:hover {
            background-color: #f7f7f7;
        }
        
        .google-icon {
            width: 20px;
            margin-left: 10px;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>تسجيل الدخول باستخدام حساب Google</h2>
        
        <a href="/auth/google/callback" class="google-btn">
            <!-- <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="google-icon"> -->
            تسجيل الدخول باستخدام Google
        </a>

        <a href="https://accounts.google.com/o/oauth2/v2/auth?
        response_type=code&
        redirect_uri=https://suhailsoft.com/auth/google/callback&
        client_id=147534173047-7ht64n693lggdt0rfmmvogh2vmgts04n.apps.googleusercontent.com&
        scope=profile%20email&
        state=if63WWgqEoGxmlUjmSeMF311&
        access_type=offline&
        prompt=consent&
        code_challenge=YOUR_PKCE_CODE_CHALLENGE&
        code_challenge_method=S256"   class="google-btn">
    
     <!-- <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google_%22G%22_Logo.svg" alt="Google" class="google-icon"> -->
     تسجيل الدخول  Google
    </a>
       
    </div>
</body>
</html>
